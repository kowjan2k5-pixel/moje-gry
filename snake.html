<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#052e16,#0f172a);font-family:Arial,sans-serif;color:#fff}
.wrap{display:flex;gap:22px;align-items:flex-start;background:#111827;padding:20px;border-radius:20px;box-shadow:0 20px 60px #0008}
canvas{width:600px;height:600px;background:#07130d;border:3px solid #475569;border-radius:8px}.side{width:170px}h1{margin:0 0 14px;font-size:38px}
.box{background:#1f2937;border-radius:12px;padding:13px;margin-bottom:10px}.label{color:#94a3b8;font-size:12px}.value{font-size:25px;font-weight:bold;margin-top:3px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}button:hover{background:#15803d}
.info{font-size:14px;line-height:1.7;color:#cbd5e1}.msg{min-height:22px;font-weight:bold;margin-bottom:8px}
@media(max-width:850px){.wrap{transform:scale(.75);transform-origin:center}.side{width:150px}}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game" width="600" height="600"></canvas>
<div class="side">
<h1>🐍 Snake</h1>
<div id="msg" class="msg">Naciśnij Spację</div>
<div class="box"><div class="label">PUNKTY</div><div id="score" class="value">0</div></div>
<div class="box"><div class="label">REKORD</div><div id="high" class="value">0</div></div>
<div class="box"><div class="label">DŁUGOŚĆ</div><div id="length" class="value">3</div></div>
<div class="box info">Sterowanie:<br>⬅️ ⬆️ ⬇️ ➡️<br><br>Spacja — start<br>P — pauza</div>
<button id="restart">Nowa gra</button>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const N=20,S=30;
let snake,food,dir,nextDir,score,high,started,paused,over,last,acc=0,speed=120;
high=Number(localStorage.getItem('snakeHigh')||0);

function newGame(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dir={x:1,y:0};nextDir={x:1,y:0};score=0;started=false;paused=false;over=false;acc=0;speed=120;
 placeFood();update();
 document.getElementById('msg').textContent='Naciśnij Spację';
 last=performance.now();requestAnimationFrame(loop);
}
function placeFood(){
 do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
 while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function update(){
 document.getElementById('score').textContent=score;
 document.getElementById('high').textContent=high;
 document.getElementById('length').textContent=snake.length;
}
function start(){if(!over){started=true;document.getElementById('msg').textContent=''}}
function step(){
 dir=nextDir;
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(p=>p.x===head.x&&p.y===head.y)){end();return}
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){
  score+=10; if(score>high){high=score;localStorage.setItem('snakeHigh',high)}
  speed=Math.max(55,120-Math.floor(score/50)*5);placeFood();
 }else snake.pop();
 update();
}
function end(){over=true;started=false;document.getElementById('msg').textContent='💥 KONIEC GRY'}
function draw(){
 ctx.clearRect(0,0,600,600);
 ctx.fillStyle='#07130d';ctx.fillRect(0,0,600,600);
 // subtle grid
 ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;
 for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(600,i*S);ctx.stroke()}
 // food
 ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(food.x*S+15,food.y*S+15,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fca5a5';ctx.beginPath();ctx.arc(food.x*S+11,food.y*S+11,3,0,Math.PI*2);ctx.fill();
 // snake
 snake.forEach((p,i)=>{
  ctx.fillStyle=i===0?'#4ade80':'#22c55e';
  ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4);
  if(i===0){ctx.fillStyle='#052e16';let ex=p.x*S+(dir.x<0?8:dir.x>0?22:9),ey=p.y*S+(dir.y<0?8:dir.y>0?22:9);ctx.beginPath();ctx.arc(ex,ey,3,0,Math.PI*2);ctx.fill()}
 });
}
function loop(t){
 if(!over){
  if(started&&!paused){acc+=t-last;if(acc>=speed){acc=0;step()}}
  draw();last=t;requestAnimationFrame(loop)
 }
}
document.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key===' '){start();return}
 if(e.key==='p'||e.key==='P'){paused=!paused;document.getElementById('msg').textContent=paused?'PAUZA':(started?'':'Naciśnij Spację');return}
 const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
 if(map[e.key]){let d=map[e.key];if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d;if(!started&&!over)start()}
});
document.getElementById('restart').onclick=newGame;
newGame();
</script>
</body>
</html>
