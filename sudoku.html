<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#312e81);font-family:Arial;color:#fff}.wrap{width:min(96vw,560px);background:#111827;padding:20px;border-radius:22px;text-align:center}h1{margin:0 0 8px;font-size:40px}.sub{color:#cbd5e1;margin-bottom:15px}#board{width:min(92vw,450px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(9,1fr);border:3px solid white}.cell{border:1px solid #64748b;background:#1f2937;color:white;font-size:clamp(18px,5vw,30px);font-weight:bold;display:grid;place-items:center;cursor:pointer}.given{background:#334155}.selected{background:#4338ca}#nums{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:15px auto;width:min(92vw,450px)}button{border:0;border-radius:8px;padding:10px;background:#4f46e5;color:white;font-weight:bold;font-size:17px;cursor:pointer}.actions{display:flex;gap:8px;justify-content:center}.info{margin-top:12px;color:#94a3b8;min-height:22px}</style></head><body><main class="wrap"><h1>🔢 Sudoku</h1><div class="sub">Wypełnij planszę cyframi 1–9</div><div id="board"></div><div id="nums"></div><div class="actions"><button onclick="newGame()">Nowa gra</button><button onclick="check()">Sprawdź</button></div><div id="info" class="info"></div></main><script>
let solution,puzzle,sel=-1;
function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solved(){let a=Array.from({length:9},()=>Array(9).fill(0));function ok(r,c,n){for(let i=0;i<9;i++)if(a[r][i]==n||a[i][c]==n||a[Math.floor(r/3)*3+Math.floor(i/3)][Math.floor(c/3)*3+i%3]==n)return false;return true}function f(k){if(k==81)return true;let r=k/9|0,c=k%9;for(let n of sh([1,2,3,4,5,6,7,8,9]))if(ok(r,c,n)){a[r][c]=n;if(f(k+1))return true;a[r][c]=0}return false}f(0);return a}
function newGame(){solution=solved();puzzle=solution.map(r=>r.slice());let ids=sh([...Array(81).keys()]);for(let i=0;i<45;i++)puzzle[ids[i]/9|0][ids[i]%9]=0;sel=-1;info.textContent='';render()}
function render(){board.innerHTML='';for(let i=0;i<81;i++){let r=i/9|0,c=i%9,b=document.createElement('button');b.className='cell';b.textContent=puzzle[r][c]||'';if(solution[r][c]==puzzle[r][c]&&puzzle[r][c])b.classList.add('given');if(i==sel)b.classList.add('selected');b.onclick=()=>{sel=i;render()};board.appendChild(b)}nums.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>put(n);nums.appendChild(b)}let b=document.createElement('button');b.textContent='⌫';b.onclick=()=>put(0);nums.appendChild(b)}
function put(n){if(sel<0)return;let r=sel/9|0,c=sel%9;if(!(solution[r][c]==puzzle[r][c]&&puzzle[r][c])){puzzle[r][c]=n;render()}}
function check(){let bad=0,empty=0;for(let i=0;i<81;i++){let r=i/9|0,c=i%9;if(!puzzle[r][c])empty++;else if(puzzle[r][c]!=solution[r][c])bad++}info.textContent=bad?'❌ Są błędne pola.':empty?'👍 Wszystko dobrze na razie!':'🎉 Sudoku rozwiązane!'}
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')put(+e.key);if(e.key==='Backspace')put(0)});newGame();
</script></body></html>
